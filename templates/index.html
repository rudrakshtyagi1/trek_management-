{% extends "base.html" %}

{% block content %}
<div class="p-5 mb-4 bg-white rounded-3 shadow-sm text-center">
    <div class="container-fluid py-5">
        <h1 class="display-5 fw-bold">Welcome to TrekManager</h1>
        <p class="col-md-8 mx-auto fs-4">Your ultimate system for organizing, managing, and booking breathtaking trekking adventures.</p>
        {% if not current_user.is_authenticated %}
            <a href="{{ url_for('register') }}" class="btn btn-primary btn-lg mt-3">Join as Trekker or Staff</a>
            <a href="{{ url_for('login') }}" class="btn btn-outline-secondary btn-lg mt-3">Login</a>
        {% else %}
            <a href="{{ url_for('index') }}" class="btn btn-success btn-lg mt-3">Go to Dashboard</a>
        {% endif %}
    </div>
</div>
{% endblock %}
