{% extends "base.html" %}

{% block content %}

<!-- ===== REGISTER FORM ===== -->
<div class="row justify-content-center mt-4">
    <div class="col-md-6 col-sm-9">
        <div class="card">

            <div class="card-header text-center py-3">
                <i class="bi bi-person-plus me-2 text-primary fs-5"></i>
                <span class="fw-semibold">Create Your Account</span>
            </div>

            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('register') }}">

                    <!-- Full Name -->
                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name"
                               placeholder="Enter your full name" required>
                    </div>

                    <!-- Username -->
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username"
                               placeholder="Choose a username" required>
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="Create a password" required>
                    </div>

                    <!-- Contact -->
                    <div class="mb-3">
                        <label for="contact" class="form-label">Phone / Contact</label>
                        <input type="text" class="form-control" id="contact" name="contact"
                               placeholder="Your phone number">
                    </div>

                    <!-- Role Selection -->
                    <div class="mb-4">
                        <label for="role" class="form-label">Register As</label>
                        <select class="form-select" id="role" name="role" required>
                            <option value="user">Trekker (User)</option>
                            <option value="staff">Trek Staff</option>
                        </select>
                        <div class="form-text">
                            Staff accounts require admin approval before login.
                        </div>
                    </div>

                    <!-- Submit -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-circle me-1"></i> Create Account
                        </button>
                    </div>

                </form>
            </div>

            <!-- Footer link -->
            <div class="card-footer text-center py-3 small text-muted">
                Already have an account?
                <a href="{{ url_for('login') }}" class="text-primary fw-medium">Login here</a>
            </div>

        </div>
    </div>
</div>
<!-- ===== END REGISTER FORM ===== -->

{% endblock %}
