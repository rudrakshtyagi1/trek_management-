{% extends "base.html" %}

{% block content %}

<!-- ===== LOGIN FORM ===== -->
<div class="row justify-content-center mt-4">
    <div class="col-md-5 col-sm-8">
        <div class="card">

            <div class="card-header text-center py-3">
                <i class="bi bi-person-circle me-2 text-primary fs-5"></i>
                <span class="fw-semibold">Sign In to Trekkers</span>
            </div>

            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('login') }}">

                    <!-- Username -->
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username"
                               placeholder="Enter your username" required autofocus>
                    </div>

                    <!-- Password -->
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="Enter your password" required>
                    </div>

                    <!-- Submit -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Login
                        </button>
                    </div>

                </form>
            </div>

            <!-- Footer link -->
            <div class="card-footer text-center py-3 small text-muted">
                Don't have an account?
                <a href="{{ url_for('register') }}" class="text-primary fw-medium">Register here</a>
            </div>

        </div>
    </div>
</div>
<!-- ===== END LOGIN FORM ===== -->

{% endblock %}
