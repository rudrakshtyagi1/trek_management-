{% extends "base.html" %}

{% block content %}

<!-- ===== CREATE TREK FORM ===== -->
<div class="row justify-content-center">
    <div class="col-md-8">

        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-sm btn-outline-secondary mb-3">
            <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
        </a>

        <div class="card">
            <div class="card-header">
                <i class="bi bi-plus-circle me-2 text-success"></i>
                Create New Trek
            </div>

            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('create_trek') }}">

                    <!-- Name & Location -->
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Trek Name</label>
                            <input type="text" class="form-control" name="name"
                                   placeholder="e.g. Himalayan Base Camp" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Location</label>
                            <input type="text" class="form-control" name="location"
                                   placeholder="e.g. Uttarakhand, India" required>
                        </div>
                    </div>

                    <!-- Difficulty, Duration, Slots -->
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Difficulty</label>
                            <select class="form-select" name="difficulty" required>
                                <option value="Easy">Easy</option>
                                <option value="Moderate">Moderate</option>
                                <option value="Hard">Hard</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Duration (Days)</label>
                            <input type="number" class="form-control" name="duration"
                                   placeholder="e.g. 5" required min="1">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Available Slots</label>
                            <input type="number" class="form-control" name="available_slots"
                                   placeholder="e.g. 20" required min="1">
                        </div>
                    </div>

                    <!-- Dates -->
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="form-label">Start Date</label>
                            <input type="date" class="form-control" name="start_date" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">End Date</label>
                            <input type="date" class="form-control" name="end_date" required>
                        </div>
                    </div>

                    <!-- Buttons -->
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-lg me-1"></i> Create Trek
                        </button>
                        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary">
                            Cancel
                        </a>
                    </div>

                </form>
            </div>
        </div>

    </div>
</div>
<!-- ===== END CREATE TREK ===== -->

{% endblock %}
