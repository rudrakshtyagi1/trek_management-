{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">Assign Staff to {{ trek.name }}</h4>
            </div>
            <div class="card-body">
                <p><strong>Location:</strong> {{ trek.location }}</p>
                <p><strong>Dates:</strong> {{ trek.start_date }} to {{ trek.end_date }}</p>
                
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Select Staff Member</label>
                        <select class="form-select" name="staff_id" required>
                            <option value="" disabled selected>Select staff...</option>
                            {% for staff in available_staff %}
                                <option value="{{ staff.id }}" {% if trek.assigned_staff_id == staff.id %}selected{% endif %}>
                                    {{ staff.name }} ({{ staff.contact }})
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Assign</button>
                    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
